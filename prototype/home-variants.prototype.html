<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Do not ship.
  Question: what should the kowuoscar.dev home page (identity card) look like?
  Three structurally different variants on one page, switchable via ?variant=A|B|C
  (floating bar at the bottom, or ← / → keys). Also ?lang=en|fr and ?theme=light|dark.
  All copy (name, bio, skills, links) is DRAFT placeholder to be corrected.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kowuoscar.dev — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;700&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{display:block}

/* ============ VARIANT A — Sticker card (Seasons-like, moderate brutalism) ============ */
.vA{--bg:#FFF8E7;--ink:#111;--card:#fff;--line:#111;--accent:#FFD23F;--accent2:#FF8A5B;--muted:#555;
  background:var(--bg);color:var(--ink);min-height:100vh;font-family:"Space Grotesk",system-ui,sans-serif;padding:0 16px 120px}
[data-theme=dark] .vA{--bg:#1A1814;--ink:#F5EFE0;--card:#24211B;--line:#F5EFE0;--muted:#B8B0A0}
.vA .wrap{max-width:780px;margin:0 auto}
.vA nav{display:flex;align-items:center;gap:20px;padding:24px 0}
.vA .logo{font-weight:700;border:3px solid var(--line);background:var(--accent);color:#111;padding:4px 10px;box-shadow:3px 3px 0 var(--line);text-decoration:none}
.vA nav .links{display:flex;gap:18px;flex:1}
.vA nav .links a{text-decoration:none;font-weight:500}
.vA nav .links a.soon{opacity:.45;pointer-events:none}
.vA .tog{border:2px solid var(--line);background:var(--card);padding:4px 10px;font-family:"JetBrains Mono",monospace;font-size:13px;box-shadow:2px 2px 0 var(--line)}
.vA .tog:active{transform:translate(2px,2px);box-shadow:none}
.vA .hero{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center;padding:48px 0 40px}
.vA .photo{position:relative;width:200px;height:200px;border:3px solid var(--line);background:var(--accent2);transform:rotate(-3deg);box-shadow:6px 6px 0 var(--line);display:grid;place-items:center;font-size:64px;font-weight:700;color:#111}
.vA .sticker{position:absolute;right:-22px;bottom:-16px;background:var(--accent);color:#111;border:3px solid var(--line);border-radius:999px;padding:6px 14px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;transform:rotate(8deg)}
.vA h1{font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.02em}
.vA .role{font-size:20px;font-weight:700;margin-top:12px}
.vA .tagline{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--muted);margin-top:6px}
.vA .loc{font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted);margin-top:4px}
.vA .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.vA .btn{border:3px solid var(--line);background:var(--card);padding:10px 16px;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.vA .btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--line)}
.vA .btn.primary{background:var(--accent);color:#111}
.vA .card{border:3px solid var(--line);background:var(--card);padding:24px;box-shadow:6px 6px 0 var(--line);margin-top:28px}
.vA h2{font-size:14px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.vA .bio{font-size:19px;line-height:1.55}
.vA .skills{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.vA .skills h3{font-size:16px;margin-bottom:8px}
.vA .chips{display:flex;flex-wrap:wrap;gap:8px}
.vA .chip{font-family:"JetBrains Mono",monospace;font-size:13px;border:2px solid var(--line);padding:2px 8px;background:var(--bg)}
.vA footer{margin-top:48px;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted)}
@media (max-width:640px){.vA .hero{grid-template-columns:1fr;justify-items:start}.vA .skills{grid-template-columns:1fr}.vA nav .links{display:none}.vA nav{justify-content:space-between}}

/* ============ VARIANT B — Terminal manifest (sidebar, mono, borders only) ============ */
.vB{--bg:#F4F4EF;--ink:#0B0F0C;--panel:#fff;--line:#0B0F0C;--accent:#00A85E;--dim:#6B716D;--key:#0B0F0C;--str:#00804A;--com:#8A8F8B;
  background:var(--bg);color:var(--ink);min-height:100vh;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:15px;
  display:grid;grid-template-columns:340px 1fr;padding-bottom:100px}
[data-theme=dark] .vB{--bg:#0B0F0C;--ink:#D7F5E3;--panel:#111814;--line:#2E3A33;--accent:#00E599;--dim:#7C8A82;--key:#9EF0C6;--str:#00E599;--com:#56635B}
.vB aside{border-right:2px solid var(--line);padding:32px 28px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px;overflow:auto}
.vB .photo{width:120px;height:120px;border:2px solid var(--accent);display:grid;place-items:center;font-size:40px;font-weight:700;background:var(--panel)}
.vB .name{font-size:24px;font-weight:700;line-height:1.2}
.vB .role{color:var(--accent);font-weight:500}
.vB .tagline,.vB .loc{color:var(--dim);font-size:13px}
.vB .cmds{display:flex;flex-direction:column;gap:6px}
.vB .cmds a{text-decoration:none}
.vB .cmds a:hover{color:var(--accent)}
.vB .cmds a::before{content:"$ ";color:var(--accent)}
.vB .cv{border:2px solid var(--accent);color:var(--accent);padding:10px 14px;text-decoration:none;font-weight:700;text-align:center}
.vB .cv:hover{background:var(--accent);color:var(--bg)}
.vB .flags{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--dim)}
.vB .flags button{background:none;border:none;text-align:left;padding:0}
.vB .flags b{color:var(--ink)}
.vB .flags .on{color:var(--accent);text-decoration:underline}
.vB main{padding:32px;min-width:0}
.vB .window{border:2px solid var(--line);background:var(--panel);max-width:860px}
.vB .titlebar{display:flex;gap:16px;border-bottom:2px solid var(--line);padding:8px 14px;font-size:13px;color:var(--dim)}
.vB .titlebar .tab{color:var(--ink);border-bottom:2px solid var(--accent);margin-bottom:-10px;padding-bottom:6px}
.vB .titlebar .tab.soon{color:var(--dim);border:none}
.vB pre{padding:22px 24px;line-height:1.75;white-space:pre-wrap;font-family:inherit;overflow-x:auto}
.vB .k{color:var(--key);font-weight:700}.vB .s{color:var(--str)}.vB .c{color:var(--com);font-style:italic}
.vB .prompt{margin-top:20px;color:var(--dim);font-size:13px}
.vB .cursor{display:inline-block;width:9px;height:16px;background:var(--accent);vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (max-width:820px){.vB{grid-template-columns:1fr}.vB aside{position:static;height:auto;border-right:none;border-bottom:2px solid var(--line)}.vB main{padding:16px}.vB pre{padding:16px;font-size:13px}}

/* ============ VARIANT C — Bento (max brutalism, multicolour) ============ */
.vC{--bg:#F2F0E9;--ink:#000;--line:#000;--shadow:#000;--pink:#FF6B9D;--blue:#4D96FF;--orange:#FF9F1C;--lime:#C6F432;--paper:#fff;
  background:var(--bg) radial-gradient(var(--dot,#0002) 1px,transparent 1px) 0 0/18px 18px;color:var(--ink);min-height:100vh;font-family:"Space Grotesk",system-ui,sans-serif;padding:24px 16px 120px}
[data-theme=dark] .vC{--bg:#121212;--shadow:#F2F0E9;--paper:#1E1E1E;--dot:#fff2}
.vC .grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.vC .t{border:4px solid var(--line);box-shadow:8px 8px 0 var(--shadow);padding:22px;background:var(--paper);color:var(--ink);transition:transform .1s,box-shadow .1s;position:relative;text-decoration:none}
[data-theme=dark] .vC .t{color:#F2F0E9}
[data-theme=dark] .vC .t.col{color:#000}
.vC a.t:hover{transform:translate(-4px,-4px);box-shadow:12px 12px 0 var(--shadow)}
.vC .name{grid-column:span 2;grid-row:span 2;background:var(--pink);display:flex;flex-direction:column;justify-content:flex-end}
.vC .name h1{font-family:"Archivo Black",sans-serif;font-size:clamp(44px,6.5vw,84px);line-height:.92;text-transform:uppercase}
.vC .name .role{font-size:20px;font-weight:700;margin-top:14px}
.vC .name .loc{font-family:"JetBrains Mono",monospace;font-size:13px;margin-top:4px}
.vC .photo{background:var(--blue);display:grid;place-items:center;font-family:"Archivo Black",sans-serif;font-size:72px;aspect-ratio:1}
.vC .cka{background:var(--orange);display:flex;flex-direction:column;justify-content:space-between}
.vC .cka .big{font-family:"Archivo Black",sans-serif;font-size:64px;line-height:1}
.vC .cka small{font-weight:700}
.vC .bio{grid-column:span 2;font-size:19px;line-height:1.5}
.vC .lbl{font-family:"JetBrains Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:10px;display:block}
.vC .link{display:flex;flex-direction:column;justify-content:space-between;min-height:120px;font-family:"Archivo Black",sans-serif;font-size:22px}
.vC .link .arr{font-size:36px;align-self:flex-end}
.vC .link.cv{background:var(--lime)}
.vC .skill h3{font-family:"Archivo Black",sans-serif;font-size:18px;margin-bottom:10px}
.vC .skill ul{list-style:none;display:flex;flex-direction:column;gap:4px;font-family:"JetBrains Mono",monospace;font-size:14px}
.vC .skill li::before{content:"■ ";color:var(--pink)}
.vC .ctrl{grid-column:span 4;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:13px}
.vC .ctrl nav{display:flex;gap:16px}
.vC .ctrl nav a{text-decoration:none;font-weight:700}
.vC .ctrl nav a.soon{opacity:.45;pointer-events:none}
.vC .ctrl .tog{border:3px solid var(--line);background:var(--lime);color:#000;padding:6px 12px;font-weight:700;box-shadow:4px 4px 0 var(--shadow)}
.vC .ctrl .tog:active{transform:translate(4px,4px);box-shadow:none}
@media (max-width:900px){.vC .grid{grid-template-columns:repeat(2,1fr)}.vC .ctrl{grid-column:span 2}}
@media (max-width:520px){.vC .grid{grid-template-columns:1fr}.vC .name,.vC .bio,.vC .ctrl{grid-column:span 1}.vC .name{grid-row:auto}}

/* ============ PROTOTYPE SWITCHER (not part of the design) ============ */
#proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;
  background:#1d1d1f;color:#fff;border-radius:999px;padding:6px;font:500 13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px #0006;outline:1px solid #fff3;white-space:nowrap}
#proto-bar button{background:#ffffff1a;border:none;color:#fff;width:32px;height:32px;border-radius:999px;font-size:16px}
#proto-bar button:hover{background:#ffffff33}
#proto-bar .lbl{padding:0 10px;text-align:center}
#proto-bar .state{display:block;font-size:11px;opacity:.6;margin-top:3px;font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div id="app"></div>
<div id="proto-bar"><button id="prev" aria-label="Previous variant">‹</button><span class="lbl"><span id="vlabel"></span><span class="state" id="vstate"></span></span><button id="next" aria-label="Next variant">›</button></div>

<script>
// ---------- DRAFT DATA (to be corrected) ----------
const D = {
  name: "Oscar Kowu", initials: "OK", domain: "kowuoscar.dev", slug: "oscar-kowu",
  links: { linkedin: "https://www.linkedin.com/in/your-handle", github: "https://github.com/your-handle", email: "mailto:hello@kowuoscar.dev", emailText: "hello@kowuoscar.dev" },
  skills: [
    { id: "languages", en: "Languages", fr: "Langages", items: ["Go", "Bash", "Python"] },
    { id: "kubernetes", en: "Kubernetes & cloud-native", fr: "Kubernetes & cloud-native", items: ["Kubernetes", "Operators / CRDs", "controller-runtime", "Kubebuilder", "Helm"] },
    { id: "platform", en: "Platform & ops", fr: "Plateforme & ops", items: ["GitOps", "CI/CD", "Observability", "Infrastructure as Code"] },
    { id: "certifications", en: "Certifications", fr: "Certifications", items: ["CKA — Certified Kubernetes Administrator"] },
  ],
};
const T = {
  en: { home:"Home", blog:"Blog", projects:"Projects", soon:"soon", role:"Infrastructure Software Engineer", tagline:"Go · Kubernetes Operators · Platform Engineering",
        loc:"Based in France", cv:"Download CV", about:"About", skills:"Skills", other:"FR",
        bio:"I build the platforms other engineers ship on. Day to day I write Go, design Kubernetes operators that turn operational know-how into code, and work to make clusters boring in the best possible way.",
        footer:"Built with Astro · Deployed on Cloudflare Pages", light:"light", dark:"dark", theme:"Theme", lang:"Language", status:"Running" },
  fr: { home:"Accueil", blog:"Blog", projects:"Projets", soon:"bientôt", role:"Infrastructure Software Engineer", tagline:"Go · Kubernetes Operators · Platform Engineering",
        loc:"Basé en France", cv:"Télécharger le CV", about:"À propos", skills:"Compétences", other:"EN",
        bio:"Je construis les plateformes sur lesquelles les autres ingénieurs livrent. Au quotidien, j'écris du Go, je conçois des operators Kubernetes qui transforment le savoir-faire opérationnel en code, et je m'efforce de rendre les clusters ennuyeux, dans le bon sens du terme.",
        footer:"Construit avec Astro · Déployé sur Cloudflare Pages", light:"clair", dark:"sombre", theme:"Thème", lang:"Langue", status:"Running" },
};

// ---------- VARIANTS ----------
const VARIANTS = {
  A: { name: "Sticker card", render: (t, s) => `
<div class="vA"><div class="wrap">
  <nav>
    <a class="logo" href="#">${D.initials}</a>
    <div class="links"><a href="#">${t.home}</a><a class="soon" href="#">${t.blog} (${t.soon})</a><a class="soon" href="#">${t.projects} (${t.soon})</a></div>
    <button class="tog" data-act="lang">${t.other}</button>
    <button class="tog" data-act="theme">${s.theme === "dark" ? "☀" : "☾"}</button>
  </nav>
  <section class="hero">
    <div class="photo">${D.initials}<span class="sticker">CKA ✓</span></div>
    <div>
      <h1>${D.name}</h1>
      <p class="role">${t.role}</p>
      <p class="tagline">${t.tagline}</p>
      <p class="loc">📍 ${t.loc}</p>
      <div class="ctas">
        <a class="btn primary" href="#">↓ ${t.cv}</a>
        <a class="btn" href="${D.links.linkedin}">LinkedIn</a>
        <a class="btn" href="${D.links.github}">GitHub</a>
        <a class="btn" href="${D.links.email}">Email</a>
      </div>
    </div>
  </section>
  <section class="card"><h2>${t.about}</h2><p class="bio">${t.bio}</p></section>
  <section class="card"><h2>${t.skills}</h2><div class="skills">
    ${D.skills.map(g => `<div><h3>${g[s.lang]}</h3><div class="chips">${g.items.map(i => `<span class="chip">${i}</span>`).join("")}</div></div>`).join("")}
  </div></section>
  <footer>© 2026 ${D.domain} · ${t.footer}</footer>
</div></div>` },

  B: { name: "Terminal manifest", render: (t, s) => {
    const k = x => `<span class="k">${x}</span>`, str = x => `<span class="s">${x}</span>`, c = x => `<span class="c"># ${x}</span>`;
    const skills = D.skills.map(g => `    ${c(g[s.lang])}\n    ${k(g.id + ":")}\n${g.items.map(i => `      - ${str(i)}`).join("\n")}`).join("\n");
    const bio = t.bio.match(/.{1,64}(\s|$)/g).map(l => `      ${str(l.trim())}`).join("\n");
    return `
<div class="vB">
  <aside>
    <div class="photo">${D.initials}</div>
    <div><div class="name">${D.name}</div><div class="role">${t.role}</div></div>
    <div class="tagline">${t.tagline}</div>
    <div class="loc">~ ${t.loc}</div>
    <div class="cmds">
      <a href="${D.links.linkedin}">open linkedin</a>
      <a href="${D.links.github}">open github</a>
      <a href="${D.links.email}">mail ${D.links.emailText}</a>
    </div>
    <a class="cv" href="#">↓ ${t.cv}</a>
    <div class="flags">
      <button data-act="lang">--lang=<b class="${s.lang === "en" ? "on" : ""}">en</b>|<b class="${s.lang === "fr" ? "on" : ""}">fr</b></button>
      <button data-act="theme">--theme=<b class="${s.theme === "light" ? "on" : ""}">${t.light}</b>|<b class="${s.theme === "dark" ? "on" : ""}">${t.dark}</b></button>
    </div>
  </aside>
  <main>
    <div class="window">
      <div class="titlebar"><span class="tab">profile.yaml</span><span class="tab soon">blog/ (${t.soon})</span><span class="tab soon">projects/ (${t.soon})</span></div>
<pre>${c(t.about)}
${k("apiVersion:")} ${str("people." + D.domain + "/v1")}
${k("kind:")} ${str("Engineer")}
${k("metadata:")}
  ${k("name:")} ${str(D.slug)}
  ${k("labels:")}
    ${k("role:")} ${str("infrastructure-software-engineer")}
    ${k("certified:")} ${str("cka")}
${k("spec:")}
  ${k("summary:")} |
${bio}
  ${k("skills:")}
${skills}
${k("status:")}
  ${k("phase:")} ${str(t.status)}
  ${k("conditions:")}
    - ${k("type:")} ${str("CKACertified")}
      ${k("status:")} ${str('"True"')}</pre>
    </div>
    <p class="prompt">$ kubectl get engineer ${D.slug} -o yaml <span class="cursor"></span></p>
    <p class="prompt">© 2026 ${D.domain} · ${t.footer}</p>
  </main>
</div>`; } },

  C: { name: "Bento max-brutal", render: (t, s) => `
<div class="vC"><div class="grid">
  <div class="t ctrl">
    <nav><a href="#">${D.domain}</a><a class="soon" href="#">${t.blog} (${t.soon})</a><a class="soon" href="#">${t.projects} (${t.soon})</a></nav>
    <div style="display:flex;gap:12px"><button class="tog" data-act="lang">${t.other}</button><button class="tog" data-act="theme">${s.theme === "dark" ? "☀ " + t.light : "☾ " + t.dark}</button></div>
  </div>
  <div class="t col name"><h1>${D.name.replace(" ", "<br>")}</h1><p class="role">${t.role}</p><p class="loc">${t.tagline} · ${t.loc}</p></div>
  <div class="t col photo">${D.initials}</div>
  <div class="t col cka"><span class="lbl">cert</span><span class="big">CKA</span><small>Certified Kubernetes Administrator</small></div>
  <a class="t col link cv" href="#"><span class="lbl">pdf</span>${t.cv}<span class="arr">↓</span></a>
  <a class="t link" href="${D.links.linkedin}"><span class="lbl">social</span>LinkedIn<span class="arr">↗</span></a>
  <div class="t bio"><span class="lbl">${t.about}</span>${t.bio}</div>
  <a class="t link" href="${D.links.github}"><span class="lbl">code</span>GitHub<span class="arr">↗</span></a>
  <a class="t link" href="${D.links.email}"><span class="lbl">mail</span>Email<span class="arr">↗</span></a>
  ${D.skills.slice(0, 3).map(g => `<div class="t skill"><span class="lbl">${t.skills}</span><h3>${g[s.lang]}</h3><ul>${g.items.map(i => `<li>${i}</li>`).join("")}</ul></div>`).join("")}
  <div class="t" style="font-family:'JetBrains Mono',monospace;font-size:13px;display:flex;align-items:flex-end">© 2026 ${D.domain}<br>${t.footer}</div>
</div></div>` },
};

// ---------- STATE + WIRING ----------
const KEYS = Object.keys(VARIANTS);
const p = new URLSearchParams(location.search);
const state = {
  variant: KEYS.includes(p.get("variant")) ? p.get("variant") : "A",
  lang: p.get("lang") === "fr" ? "fr" : "en",
  theme: ["light", "dark"].includes(p.get("theme")) ? p.get("theme") : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
};
function render() {
  const v = VARIANTS[state.variant];
  document.body.dataset.theme = state.theme;
  document.documentElement.lang = state.lang;
  document.getElementById("app").innerHTML = v.render(T[state.lang], state);
  document.getElementById("vlabel").textContent = `${state.variant} · ${v.name}`;
  document.getElementById("vstate").textContent = `lang=${state.lang} theme=${state.theme}`;
  history.replaceState(null, "", `?variant=${state.variant}&lang=${state.lang}&theme=${state.theme}`);
}
function cycle(d) { state.variant = KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length]; render(); }
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  if (b.dataset.act === "lang") state.lang = state.lang === "en" ? "fr" : "en";
  if (b.dataset.act === "theme") state.theme = state.theme === "dark" ? "light" : "dark";
  render();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
