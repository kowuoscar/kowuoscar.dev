<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Do not ship.
  Question: which colour duo for variant A ("Sticker card"), now with C's dotted background drifting
  diagonally from bottom-left to top-right?
  Same layout in every variant — only the colour duo changes (explicit user request).
  ?variant=1|2|3  ?lang=en|fr  ?theme=light|dark  ?motion=on|off   (← / → keys cycle variants)
  All copy is DRAFT placeholder.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kowuoscar.dev — prototype A colours</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- colour duos: --accent = primary (CV button, logo, sticker), --accent2 = secondary (photo, labels) ---------- */
/* 1 · Lime / Violet */
[data-duo="1"]{--bg:#F7F5EE;--ink:#121212;--card:#fff;--accent:#C6F432;--on-accent:#121212;--accent2:#8B5CF6;--on-accent2:#fff;--muted:#555;--dot:#12121233}
[data-duo="1"][data-theme=dark]{--bg:#141318;--ink:#F1EEF8;--card:#1F1D26;--accent2:#A78BFA;--on-accent2:#121212;--muted:#ABA6B8;--dot:#F1EEF826}
/* 2 · Coral / Teal */
[data-duo="2"]{--bg:#FFF6EF;--ink:#14110F;--card:#fff;--accent:#FF7A59;--on-accent:#14110F;--accent2:#2EC4B6;--on-accent2:#14110F;--muted:#5C534D;--dot:#14110F33}
[data-duo="2"][data-theme=dark]{--bg:#131615;--ink:#F4EEE8;--card:#1D2221;--muted:#A9B3B0;--dot:#F4EEE826}
/* 3 · Kubernetes blue / Yellow */
[data-duo="3"]{--bg:#F3F5FA;--ink:#0E1424;--card:#fff;--accent:#326CE5;--on-accent:#fff;--accent2:#FFD23F;--on-accent2:#0E1424;--muted:#4F5770;--dot:#0E142433}
[data-duo="3"][data-theme=dark]{--bg:#0E1220;--ink:#E9EEFB;--card:#182036;--accent:#5B8CFF;--on-accent:#0E1220;--muted:#9AA4C0;--dot:#E9EEFB26}

body{background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;padding:0 16px 120px;transition:background .2s}

/* ---------- drifting dotted background: oversized fixed layer, translated by exactly one tile so the loop is seamless ---------- */
.dots{position:fixed;inset:-40px;z-index:0;pointer-events:none;
  background:radial-gradient(var(--dot) 1.2px,transparent 1.4px) 0 0/20px 20px;
  animation:drift 3s linear infinite}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(20px,-20px)}} /* bottom-left → top-right */
[data-motion=off] .dots{animation:none}
@media (prefers-reduced-motion:reduce){.dots{animation:none}}

.wrap{position:relative;z-index:1;max-width:780px;margin:0 auto}
nav{display:flex;align-items:center;gap:20px;padding:24px 0}
.logo{font-weight:700;border:3px solid var(--ink);background:var(--accent);color:var(--on-accent);padding:4px 10px;box-shadow:3px 3px 0 var(--ink);text-decoration:none}
nav .links{display:flex;gap:18px;flex:1}
nav .links a{text-decoration:none;font-weight:500}
nav .links a.soon{opacity:.45;pointer-events:none}
.tog{border:2px solid var(--ink);background:var(--card);padding:4px 10px;font-family:"JetBrains Mono",monospace;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.tog:active{transform:translate(2px,2px);box-shadow:none}
.hero{display:grid;grid-template-columns:200px 1fr;gap:36px;align-items:center;padding:48px 0 40px}
.photo{position:relative;width:200px;height:200px;border:3px solid var(--ink);background:var(--accent2);color:var(--on-accent2);transform:rotate(-3deg);box-shadow:6px 6px 0 var(--ink);display:grid;place-items:center;font-size:64px;font-weight:700}
.sticker{position:absolute;right:-22px;bottom:-16px;background:var(--accent);color:var(--on-accent);border:3px solid var(--ink);border-radius:999px;padding:6px 14px;font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;transform:rotate(8deg)}
h1{font-size:clamp(40px,7vw,64px);line-height:1;letter-spacing:-.02em}
.role{font-size:20px;font-weight:700;margin-top:12px}
.tagline,.loc{font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--muted);margin-top:6px}
.loc{font-size:13px;margin-top:4px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.btn{border:3px solid var(--ink);background:var(--card);padding:10px 16px;font-weight:700;text-decoration:none;box-shadow:4px 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .08s}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);background:var(--accent2);color:var(--on-accent2)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent);color:var(--on-accent)}
.card{border:3px solid var(--ink);background:var(--card);padding:24px;box-shadow:6px 6px 0 var(--ink);margin-top:28px}
h2{display:inline-block;font-size:13px;font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.1em;margin-bottom:14px;background:var(--accent2);color:var(--on-accent2);border:2px solid var(--ink);padding:2px 8px}
.bio{font-size:19px;line-height:1.55}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.skills h3{font-size:16px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:"JetBrains Mono",monospace;font-size:13px;border:2px solid var(--ink);padding:2px 8px;background:var(--bg)}
footer{margin-top:48px;font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--muted)}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:start}.skills{grid-template-columns:1fr}nav .links{display:none}nav{justify-content:space-between}}

/* ---------- PROTOTYPE SWITCHER (not part of the design) ---------- */
#proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:6px;background:#1d1d1f;color:#fff;border-radius:999px;padding:6px;font:500 13px/1 -apple-system,system-ui,sans-serif;box-shadow:0 6px 24px #0006;outline:1px solid #fff3;white-space:nowrap}
#proto-bar button{background:#ffffff1a;border:none;color:#fff;min-width:32px;height:32px;border-radius:999px;font-size:16px;padding:0 8px}
#proto-bar button:hover{background:#ffffff33}
#proto-bar #motion{font-size:12px}
#proto-bar .lbl{padding:0 10px;text-align:center}
#proto-bar .state{display:block;font-size:11px;opacity:.6;margin-top:3px;font-family:ui-monospace,monospace}
#proto-bar .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px;outline:1px solid #fff6}
</style>
</head>
<body>
<div class="dots" aria-hidden="true"></div>
<div id="app"></div>
<div id="proto-bar"><button id="prev" aria-label="Previous variant">‹</button><span class="lbl"><span id="vlabel"></span><span class="state" id="vstate"></span></span><button id="next" aria-label="Next variant">›</button><button id="motion" title="Toggle background motion"></button></div>

<script>
const D = {
  name: "Oscar Kowu", initials: "OK", domain: "kowuoscar.dev",
  links: { linkedin: "https://www.linkedin.com/in/your-handle", github: "https://github.com/your-handle", email: "mailto:hello@kowuoscar.dev" },
  skills: [
    { en: "Languages", fr: "Langages", items: ["Go", "Bash", "Python"] },
    { en: "Kubernetes & cloud-native", fr: "Kubernetes & cloud-native", items: ["Kubernetes", "Operators / CRDs", "controller-runtime", "Kubebuilder", "Helm"] },
    { en: "Platform & ops", fr: "Plateforme & ops", items: ["GitOps", "CI/CD", "Observability", "Infrastructure as Code"] },
    { en: "Certifications", fr: "Certifications", items: ["CKA — Certified Kubernetes Administrator"] },
  ],
};
const T = {
  en: { home:"Home", blog:"Blog", projects:"Projects", soon:"soon", role:"Infrastructure Software Engineer", tagline:"Go · Kubernetes Operators · Platform Engineering",
        loc:"Based in France", cv:"Download CV", about:"About", skills:"Skills", other:"FR",
        bio:"I build the platforms other engineers ship on. Day to day I write Go, design Kubernetes operators that turn operational know-how into code, and work to make clusters boring in the best possible way.",
        footer:"Built with Astro · Deployed on Cloudflare Pages" },
  fr: { home:"Accueil", blog:"Blog", projects:"Projets", soon:"bientôt", role:"Infrastructure Software Engineer", tagline:"Go · Kubernetes Operators · Platform Engineering",
        loc:"Basé en France", cv:"Télécharger le CV", about:"À propos", skills:"Compétences", other:"EN",
        bio:"Je construis les plateformes sur lesquelles les autres ingénieurs livrent. Au quotidien, j'écris du Go, je conçois des operators Kubernetes qui transforment le savoir-faire opérationnel en code, et je m'efforce de rendre les clusters ennuyeux, dans le bon sens du terme.",
        footer:"Construit avec Astro · Déployé sur Cloudflare Pages" },
};
const DUOS = { "1": "Lime / Violet", "2": "Corail / Turquoise", "3": "Bleu K8s / Jaune" };

const page = (t, s) => `
<div class="wrap">
  <nav>
    <a class="logo" href="#">${D.initials}</a>
    <div class="links"><a href="#">${t.home}</a><a class="soon" href="#">${t.blog} (${t.soon})</a><a class="soon" href="#">${t.projects} (${t.soon})</a></div>
    <button class="tog" data-act="lang">${t.other}</button>
    <button class="tog" data-act="theme">${s.theme === "dark" ? "☀" : "☾"}</button>
  </nav>
  <section class="hero">
    <div class="photo">${D.initials}<span class="sticker">CKA ✓</span></div>
    <div>
      <h1>${D.name}</h1>
      <p class="role">${t.role}</p>
      <p class="tagline">${t.tagline}</p>
      <p class="loc">📍 ${t.loc}</p>
      <div class="ctas">
        <a class="btn primary" href="#">↓ ${t.cv}</a>
        <a class="btn" href="${D.links.linkedin}">LinkedIn</a>
        <a class="btn" href="${D.links.github}">GitHub</a>
        <a class="btn" href="${D.links.email}">Email</a>
      </div>
    </div>
  </section>
  <section class="card"><h2>${t.about}</h2><p class="bio">${t.bio}</p></section>
  <section class="card"><h2>${t.skills}</h2><div class="skills">
    ${D.skills.map(g => `<div><h3>${g[s.lang]}</h3><div class="chips">${g.items.map(i => `<span class="chip">${i}</span>`).join("")}</div></div>`).join("")}
  </div></section>
  <footer>© 2026 ${D.domain} · ${t.footer}</footer>
</div>`;

const KEYS = Object.keys(DUOS);
const p = new URLSearchParams(location.search);
const state = {
  variant: KEYS.includes(p.get("variant")) ? p.get("variant") : "1",
  lang: p.get("lang") === "fr" ? "fr" : "en",
  theme: ["light", "dark"].includes(p.get("theme")) ? p.get("theme") : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
  motion: p.get("motion") === "off" ? "off" : "on",
};
function render() {
  const b = document.body;
  b.dataset.duo = state.variant; b.dataset.theme = state.theme; b.dataset.motion = state.motion;
  document.documentElement.lang = state.lang;
  document.getElementById("app").innerHTML = page(T[state.lang], state);
  const cs = getComputedStyle(b);
  const sw = v => `<span class="sw" style="background:${cs.getPropertyValue(v)}"></span>`;
  document.getElementById("vlabel").innerHTML = `${sw("--accent")}${sw("--accent2")} ${state.variant} · ${DUOS[state.variant]}`;
  document.getElementById("vstate").textContent = `lang=${state.lang} theme=${state.theme} motion=${state.motion}`;
  document.getElementById("motion").textContent = state.motion === "on" ? "❚❚" : "▶";
  history.replaceState(null, "", `?variant=${state.variant}&lang=${state.lang}&theme=${state.theme}&motion=${state.motion}`);
}
function cycle(d) { state.variant = KEYS[(KEYS.indexOf(state.variant) + d + KEYS.length) % KEYS.length]; render(); }
document.getElementById("prev").onclick = () => cycle(-1);
document.getElementById("next").onclick = () => cycle(1);
document.getElementById("motion").onclick = () => { state.motion = state.motion === "on" ? "off" : "on"; render(); };
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "lang") state.lang = state.lang === "en" ? "fr" : "en";
  if (el.dataset.act === "theme") state.theme = state.theme === "dark" ? "light" : "dark";
  render();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") cycle(-1);
  if (e.key === "ArrowRight") cycle(1);
});
render();
</script>
</body>
</html>
